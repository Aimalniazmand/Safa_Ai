<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safa AI — Intelligent Multilingual Coding Assistant</title>
    <meta name="description" content="Safa AI - Professional multilingual AI coding assistant supporting Pashto, Hindi, Dari, and English with female voice." />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2310b981'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #030712 !important;
        color: #ffffff;
      }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM("dark");
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : "",
                },
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
